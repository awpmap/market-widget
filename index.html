<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="description" content="A small market widget with sector heatmap, portfolio summary and intraday dip alerts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Market Widget</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#0e1116; --surface:#151922; --surface-2:#1b202b; --line:#252b37; --line-2:#2f3746;
  --fg:#e9ecf1; --fg-2:#b7bfcc; --muted:#808a9b;
  --up:#22c55e; --down:#f04f4f; --warn:#f5b43c; --accent:#5b9dff; --accent-fg:#0b1220;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --r:12px; --r-sm:8px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f0f3f7; --line:#e3e7ee; --line-2:#d5dbe5;
  --fg:#131722; --fg-2:#3c4555; --muted:#667085;
  --up:#0f9d58; --down:#d93025; --warn:#b26a00; --accent:#1a5fd6; --accent-fg:#fff;
  --shadow:0 8px 30px rgba(20,30,50,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f0f3f7; --line:#e3e7ee; --line-2:#d5dbe5;
    --fg:#131722; --fg-2:#3c4555; --muted:#667085;
    --up:#0f9d58; --down:#d93025; --warn:#b26a00; --accent:#1a5fd6; --accent-fg:#fff;
    --shadow:0 8px 30px rgba(20,30,50,.12);
    color-scheme: light;
  }
}

/* ============ base ============ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased}
body{overflow:hidden;display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;user-select:text}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.hide{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ title bar (native-looking; uses Window Controls Overlay when installed) ============ */
#titlebar{
  flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 8px 0 12px;
  background:var(--bg);border-bottom:1px solid var(--line);app-region:drag;-webkit-app-region:drag;
}
body.wco #titlebar{
  position:fixed;left:env(titlebar-area-x,0);top:env(titlebar-area-y,0);
  width:env(titlebar-area-width,100%);height:env(titlebar-area-height,40px);border-bottom:0;padding-right:4px;
}
body.wco main{margin-top:env(titlebar-area-height,40px)}
.logo{width:18px;height:18px;flex:none}
.appname{font:600 13px var(--font-d);letter-spacing:.1px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-2);padding:2px 8px;border-radius:20px;background:var(--surface-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.open i{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent)}
.pill.ext i{background:var(--warn)}
.spacer{flex:1}
.tb-btn{app-region:no-drag;-webkit-app-region:no-drag;width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--fg-2);position:relative}
.tb-btn:hover{background:var(--surface-2);color:var(--fg)}
.tb-btn svg{width:16px;height:16px}
.menu{position:fixed;z-index:45;right:8px;top:44px;min-width:200px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:5px}
body.wco .menu{top:calc(env(titlebar-area-height,40px) + 4px);right:calc(100vw - env(titlebar-area-x,0px) - env(titlebar-area-width,100vw) + 6px)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--fg);text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2);outline:none}
.menu svg{width:15px;height:15px;color:var(--fg-2);flex:none}
.menu span{flex:1}
.menu kbd{font:10.5px var(--mono);color:var(--muted);background:var(--surface-2);border-radius:4px;padding:1px 5px}
.msep{height:1px;background:var(--line);margin:4px 6px}
#titlebar{container-type:inline-size}
@container (max-width:330px){ .appname{display:none} }
@container (max-width:250px){ .pill span{display:none} .pill{padding:4px} }
@media (max-width:420px){ .appname{display:none} }
.tb-btn .badge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--down);color:#fff;font-size:9.5px;line-height:14px;font-weight:700}
.tb-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ layout ============ */
main{flex:1;overflow:auto;padding:10px 10px 14px;scroll-behavior:smooth}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;text-align:left}
.sec-h:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.chev{width:14px;height:14px;color:var(--muted);transition:transform .18s;flex:none}
.sec.collapsed .chev{transform:rotate(-90deg)}
.sec-t{font:600 12px var(--font-d);text-transform:uppercase;letter-spacing:.7px;color:var(--fg-2)}
.sec-sum{margin-left:auto;display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden}
.sec-b{padding:0 12px 12px}
.sec.collapsed .sec-b{display:none}
body:not(.compact) #pf-sec:not(.collapsed) #pf-sum{visibility:hidden}
body.compact .sec-b{display:none}
body.compact .sec .chev{transform:rotate(-90deg)}
body.compact #log-sec, body.compact footer{display:none}

/* ============ portfolio ============ */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 10px}
.hero .val{font:600 28px/1.05 var(--font-d);letter-spacing:-.5px}
.hero .chg{font:600 15px var(--font-d);text-align:right}
.hero .chg small{display:block;font:400 11px var(--font);color:var(--muted);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kpi{background:var(--surface-2);border-radius:var(--r-sm);padding:7px 9px}
.kpi b{display:block;font:600 14px var(--font-d)}
.kpi span{font-size:10.5px;color:var(--muted)}
.alloc{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin:2px 0 6px}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--fg-2);margin-bottom:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.toolbar{display:flex;align-items:center;gap:6px;margin:6px 0 4px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
.seg button{font-size:11px;padding:3px 8px;border-radius:6px;color:var(--fg-2)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.grp{margin-top:6px}
.grp-h{display:flex;align-items:center;gap:6px;width:100%;padding:7px 2px;font-size:11.5px;color:var(--fg-2);border-top:1px solid var(--line)}
.grp-h b{color:var(--fg);font-weight:600}
.grp-h .r{margin-left:auto;display:flex;gap:10px}
.grp.collapsed .grp-rows{display:none}
.grp.collapsed .chev{transform:rotate(-90deg)}
.hrow{display:grid;grid-template-columns:minmax(64px,1fr) 64px minmax(70px,auto) 62px;gap:8px;align-items:center;padding:7px 2px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);width:100%;text-align:left;border-radius:6px}
.hrow:hover{background:var(--surface-2)}
.hrow .s{font-weight:600}
.hrow .s small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .v{text-align:right}
.hrow .v small{display:block;font-size:10.5px;color:var(--muted)}
.spark{width:64px;height:26px;display:block}
.dp{justify-self:end;font-weight:600;font-size:12px;padding:3px 6px;border-radius:6px;min-width:58px;text-align:right}
.dp.up{background:color-mix(in srgb,var(--up) 15%,transparent)}
.dp.down{background:color-mix(in srgb,var(--down) 15%,transparent)}
.detail{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:8px 4px 4px;font-size:11.5px;color:var(--fg-2);cursor:default}
.detail b{color:var(--fg);font-weight:600}
.range{grid-column:1/-1;margin-top:2px}
.range .bar{position:relative;height:4px;border-radius:3px;background:var(--line-2);margin:6px 0 3px}
.range .bar i{position:absolute;top:-4px;width:3px;height:12px;border-radius:2px;background:var(--fg)}
.range .lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.empty{padding:14px 4px;color:var(--muted);font-size:12px;text-align:center}
.empty button{color:var(--accent);font-weight:600}

/* ============ markets ============ */
.idx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.idx .c{background:var(--surface-2);border-radius:var(--r-sm);padding:7px 8px;min-width:0}
.idx .c span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx .c b{display:block;font:600 13.5px var(--font-d)}
.idx .c em{font-style:normal;font-size:11px;color:var(--fg-2)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px}
.tile{border-radius:8px;padding:8px 8px 7px;min-height:56px;display:flex;flex-direction:column;justify-content:space-between;color:var(--fg);position:relative;overflow:hidden}
.tile{border:0;text-align:left;font:inherit;cursor:pointer;outline:none}
.tile.focus,.idx .c.focus{box-shadow:inset 0 0 0 2px var(--fg)}
.idx .c{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.perseg{display:flex;width:100%;margin-bottom:8px}
.perseg button{flex:1;padding:4px 0}
.rbtn{font-size:11px;color:var(--accent);font-weight:600;padding:2px 6px;border-radius:6px}
.rbtn:hover{background:var(--surface-2)}
.tile .n{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .p{font:700 15px var(--font-d)}
.tile .t{font-size:9.5px;opacity:.7;font-weight:600}
.tile .b{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.breadth{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--fg-2);margin:8px 0 0}
.breadth .bar{flex:1;height:6px;border-radius:4px;background:var(--down);overflow:hidden}
.breadth .bar i{display:block;height:100%;background:var(--up)}
.note{font-size:10.5px;color:var(--muted);margin-top:6px}

/* ============ watchlist ============ */
.wrow{padding:9px 10px 9px 12px;margin:0 -12px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);position:relative}
.wrow:first-child{border-top:0}
.wrow::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.wrow.st-hit::before{background:var(--down)} .wrow.st-near::before{background:var(--warn)}
.wrow.muted-row{opacity:.55}
.wtop{display:grid;grid-template-columns:minmax(64px,1fr) 64px minmax(70px,auto) 62px;gap:8px;align-items:center}
.wtop .s{font-weight:600}
.wtop .s small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lad{position:relative;height:30px;margin:8px 4px 0}
.lad .track{position:absolute;left:0;right:0;top:7px;height:3px;background:var(--line-2);border-radius:3px}
.lad .zone{position:absolute;top:7px;height:3px;background:color-mix(in srgb,var(--warn) 55%,transparent);border-radius:3px}
.lad .tk{position:absolute;top:2px;width:2px;height:13px;margin-left:-1px;background:var(--warn);border-radius:1px}
.lad .tl{position:absolute;top:17px;transform:translateX(-50%);font-size:10px;color:var(--fg-2);white-space:nowrap}
.lad .now{position:absolute;top:3px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.wmeta{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:11.5px;color:var(--fg-2)}
.wmeta b{color:var(--fg);font-weight:600}
.wmeta .st{font-weight:600}
.wmeta .st.hit{color:var(--down)} .wmeta .st.near{color:var(--warn)}
.wmeta .r{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted)}
.chip{font-size:10.5px;background:var(--surface-2);border-radius:10px;padding:2px 8px;color:var(--fg-2);white-space:nowrap}
.steps{margin:0 0 12px;padding-left:18px;font-size:12.5px;line-height:1.55}
.steps li{margin-bottom:6px}
.codebox{width:100%;height:84px;font:11px var(--mono);word-break:break-all}
.ok{color:var(--up);font-weight:600}

/* ============ alert log, banner, toast ============ */
.log div{font-size:11.5px;padding:5px 0;border-top:1px dashed var(--line);display:flex;gap:8px}
.log div:first-child{border-top:0}
.log time{color:var(--muted);flex:none;width:58px}
#banner{display:none;margin-bottom:10px;background:var(--down);color:#fff;border-radius:var(--r);padding:10px 12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
#banner.show{display:block;animation:pulse 1s ease-in-out 3}
#banner small{display:block;font-weight:400;opacity:.85;margin-top:2px}
@keyframes pulse{50%{opacity:.6}}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:12px;transition:.2s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.callout{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:12px;margin-bottom:10px;font-size:12.5px}
.callout b{display:block;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.err{color:var(--down);font-size:11.5px;margin:6px 2px}
footer{font-size:10.5px;color:var(--muted);padding:2px 4px 6px;display:flex;justify-content:space-between;gap:8px}

/* ============ settings sheet ============ */
#sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg)}
body.wco #sheet{top:env(titlebar-area-height,40px)}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh-h b{font:600 14px var(--font-d);flex:1}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:7px 10px;font-size:12px;color:var(--fg-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.sh-b{flex:1;overflow:auto;padding:12px;user-select:text}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.field p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.field input[type=text],.field input[type=password],.field select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table.ed{width:100%;border-collapse:collapse;font-size:12px}
table.ed th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;font-weight:600;padding:4px 3px}
table.ed td{padding:3px}
table.ed input,table.ed select{width:100%;padding:5px 6px}
.x{color:var(--muted);width:26px;height:26px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--down)}
.rule{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--surface)}
.rule-h{display:flex;align-items:center;gap:8px;font-weight:600}
.rule-h .note{font-weight:400;font-size:11px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts{display:grid;grid-template-columns:1fr auto;gap:5px 8px;margin:8px 0 0 2px;font-size:12px;align-items:center}
.opts.dis{opacity:.4;pointer-events:none}
.opts label{display:flex;align-items:center;gap:7px}
.opts input[type=number]{width:62px;padding:4px 6px}
.opts input[type=text]{width:140px;padding:4px 6px}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:0}
.sw{position:relative;width:34px;height:20px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line-2);border-radius:10px;transition:.15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(14px)}
.mk-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.mk-list label{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 0}
textarea.code{width:100%;height:160px;font:11.5px var(--mono)}
.sh-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);justify-content:flex-end}
@media (max-width:360px){ .kpis{grid-template-columns:1fr 1fr} .idx{grid-template-columns:1fr 1fr} .hrow,.wtop{grid-template-columns:minmax(56px,1fr) 0 auto 58px} .spark{display:none} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>

<header id="titlebar">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1a5fd6"/><path d="M6 21l6-6 5 4 9-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="appname">Market Widget</span>
  <span id="mkt" class="pill"><i></i><span>—</span></span>
  <span class="spacer"></span>
  <button class="tb-btn" id="bRefresh" title="Refresh now (R)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></button>
  <button class="tb-btn" id="bAlerts" title="Alerts"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.2 1.5H2.8z"/><path d="M6.5 14h3"/></svg><span class="badge hide" id="badge">0</span></button>
  <button class="tb-btn" id="bMore" title="Menu" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
</header>
<div id="menu" class="menu hide" role="menu">

<div id="toast"></div>

<script>
"use strict";
const APP_VERSION = "2.5.0";

/* =====================================================================
   Public build: NO personal data lives in this file.
   Your key, holdings and alert levels are stored only in this browser.
   ===================================================================== */
const DEFAULT_CFG = { holdings: [], fixed: [], watch: [
  {sym:"QQQ", note:"Market check: big red day", dayDrop:2, offHigh:10, levels:[], near:0}
]};

const MARKETS = {
  indices: [
    {sym:"SPY", name:"S&P 500"}, {sym:"QQQ", name:"Nasdaq 100"},
    {sym:"DIA", name:"Dow"},     {sym:"IWM", name:"Small caps"}
  ],
  sectors: [
    {sym:"SMH", name:"Chips"},            {sym:"XLK", name:"Tech"},
    {sym:"XLC", name:"Comms"},    {sym:"XLY", name:"Consumer"},
    {sym:"XLF", name:"Financials"},       {sym:"XLV", name:"Healthcare"},
    {sym:"XLI", name:"Industrials"},      {sym:"XLE", name:"Energy"},
    {sym:"XLB", name:"Materials"},        {sym:"XLU", name:"Utilities"},
    {sym:"XLP", name:"Staples"},          {sym:"XLRE", name:"Real estate"},
    {sym:"GRID", name:"Power grid"},      {sym:"IGV", name:"Software"}
  ],
  other: [
    {sym:"GLD", name:"Gold"}, {sym:"TLT", name:"Long bonds"},
    {sym:"VEA", name:"International"}, {sym:"VWO", name:"Emerging"}
  ]
};
const PERIODS = [   // TradingView-style ranges
  {k:"1D", label:"1D"},
  {k:"5D", label:"5D", sessions:5, f:"5DayPriceReturnDaily"},
  {k:"1M", label:"1M", months:1},
  {k:"3M", label:"3M", months:3, f:"13WeekPriceReturnDaily"},
  {k:"6M", label:"6M", months:6, f:"26WeekPriceReturnDaily"},
  {k:"YTD", label:"YTD", ytd:true, f:"yearToDatePriceReturnDaily"},
  {k:"1Y", label:"1Y", months:12, f:"52WeekPriceReturnDaily"},
  {k:"3Y", label:"3Y", months:36},
  {k:"5Y", label:"5Y", months:60}
];
const HEAT_CAP = {"1D":2.5,"5D":5,"1M":8,"3M":12,"6M":18,"YTD":25,"1Y":30,"3Y":60,"5Y":100};
const ACCT_COLORS = ["#5b9dff","#a78bfa","#2dd4bf","#f59e0b","#f472b6","#94a3b8"];

/* ---------- storage (graceful when blocked) ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem("mw_"+k); if (v!=null) return JSON.parse(v); }catch(e){} return (k in mem) ? mem[k] : d; },
  set(k, v){ mem[k] = v; try{ localStorage.setItem("mw_"+k, JSON.stringify(v)); }catch(e){} }
};
let cfg = store.get("cfg", null) || JSON.parse(JSON.stringify(DEFAULT_CFG));
cfg.holdings = cfg.holdings || []; cfg.fixed = cfg.fixed || []; cfg.watch = cfg.watch || []; cfg.hiddenMk = cfg.hiddenMk || [];

/* one-time private setup link: #setup=<base64 json>. Read locally, never sent anywhere. */
(function(){
  try{
    const m = location.hash.match(/^#setup=([A-Za-z0-9+/=_-]+)$/);
    if (m){
      const c = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
      if (Array.isArray(c.holdings) && Array.isArray(c.watch)){ c.fixed = c.fixed||[]; c.hiddenMk = c.hiddenMk||[]; cfg = c; store.set("cfg", cfg); }
    }
  }catch(e){}
  if (location.hash) try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
})();

let settings = Object.assign({key:"", tdKey:"", ntfy:"", sound:"on", theme:"auto", refresh:60, compact:false, collapsed:{}, allOff:false, period:"1D", sort:"value", grpCollapsed:{}, heatOrder:"fixed", focus:""}, store.get("settings", {}));
if (!PERIODS.some(p=>p.k===settings.period)) settings.period = settings.period==="MTD" ? "1M" : "1D";
/* funds typed as "ABCDX (12.3 sh ...)" get their ticker and shares picked up automatically */
cfg.fixed.forEach(f=>{ if (!f.sym){ const m = String(f.name||"").match(/^([A-Z]{3,5})\s*\(\s*([\d.]+)\s*sh/); if (m){ f.sym = m[1]; f.shares = +m[2]; } } });
store.set("cfg", cfg);
document.documentElement.dataset.theme = settings.theme;
const saveSettings = ()=> store.set("settings", settings);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt$ = (n, d=2) => (n==null||!isFinite(n)) ? "—" : (n<0?"−":"") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtS$ = (n, d=0) => (n==null||!isFinite(n)) ? "—" : (n>=0?"+":"−") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct = (n, d=2) => (n==null||!isFinite(n)) ? "—" : (n>=0?"+":"−") + Math.abs(n).toFixed(d) + "%";
const cls = n => (n==null||!isFinite(n)) ? "" : n>=0 ? "up" : "down";
const timeStr = t => new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"), 2200); }

/* ---------- market clock (US Eastern) ---------- */
function etNow(){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour12:false,weekday:"short",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date());
  const o = {}; p.forEach(x=>o[x.type]=x.value);
  return {day:o.weekday, date:`${o.year}-${o.month}-${o.day}`, mins:(+o.hour%24)*60 + (+o.minute)};
}
function session(){
  const t = etNow();
  if (t.day==="Sat"||t.day==="Sun") return {s:"closed", label:"Weekend"};
  if (t.mins>=570 && t.mins<960) return {s:"open", label:"Market open"};
  if (t.mins>=240 && t.mins<570) return {s:"ext", label:"Pre-market"};
  if (t.mins>=960 && t.mins<1200) return {s:"ext", label:"After hours"};
  return {s:"closed", label:"Closed"};
}
function refreshMs(){ if (+settings.refresh === 0) return null; const s = session().s; return s==="open" ? Math.max(30, +settings.refresh||60)*1000 : s==="ext" ? 5*60e3 : 30*60e3; }

/* ---------- data: Finnhub free tier, rate-limited (55 calls / rolling minute) ---------- */
const API = "https://finnhub.io/api/v1/";
const RL = {times:[], active:0, hi:[], lo:[], timer:null};
function limited(fn, low){ return new Promise((res, rej)=>{ (low?RL.lo:RL.hi).push({fn,res,rej}); pump(); }); }
function pump(){
  const now = Date.now(); RL.times = RL.times.filter(t => now - t < 60000);
  while ((RL.hi.length || RL.lo.length) && RL.active < 6 && RL.times.length < 55){
    const j = RL.hi.length ? RL.hi.shift() : RL.lo.shift();
    RL.active++; RL.times.push(Date.now());
    j.fn().then(j.res, j.rej).finally(()=>{ RL.active--; pump(); });
  }
  if ((RL.hi.length || RL.lo.length) && !RL.timer){
    const wait = RL.times.length >= 55 ? (60000 - (now - RL.times[0]) + 50) : 150;
    RL.timer = setTimeout(()=>{ RL.timer = null; pump(); }, wait);
  }
}
let lastErr = "";
async function api(path){
  const r = await fetch(API + path + (path.includes("?")?"&":"?") + "token=" + encodeURIComponent(settings.key));
  if (r.status===401||r.status===403) throw new Error("Finnhub didn't accept the key. Check it in Settings.");
  if (r.status===429) throw new Error("Free data limit reached for this minute. Retrying shortly.");
  if (!r.ok) throw new Error("Data error " + r.status);
  return r.json();
}

let quotes = store.get("lastQuotes", {});   // sym -> quote; kept so the app opens instantly with last known values
let metrics = store.get("metrics", {});     // sym -> {date, hi, lo, r:{5D,MTD,...}}
let spark = store.get("spark", {});         // {date: {sym:[prices]}}
let lastUpdate = store.get("lastUpdate", 0);

function marketSyms(){ return [...MARKETS.indices, ...MARKETS.sectors, ...MARKETS.other].map(m=>m.sym).filter(s=>!cfg.hiddenMk.includes(s)); }
async function refreshOne(sym){
  if (!settings.key) return;
  toast("Updating " + sym + "…");
  try{
    let q = null;
    try{ q = await limited(()=>api("quote?symbol=" + encodeURIComponent(sym))); }catch(e){}
    if (!(q && q.c)) q = await backupQuote(sym).catch(()=>null);
    if (q && q.c){ quotes[sym] = q; store.set("lastQuotes", quotes);
      const day = etNow().date; if (session().s !== "closed"){ if (!spark[day]) spark = {[day]:{}}; const a = spark[day][sym] || (spark[day][sym] = []); if (a[a.length-1] !== q.c) a.push(q.c); store.set("spark", spark); }
      renderAll(); checkAlerts(); toast(sym + " updated · " + fmt$(q.c));
    } else toast("No price for " + sym);
  }catch(e){ toast(e.message); }
}
function allSyms(){
  const s = new Set();
  cfg.holdings.forEach(h=>h.sym && s.add(h.sym.toUpperCase()));
  cfg.watch.forEach(w=>w.sym && s.add(w.sym.toUpperCase()));
  [...MARKETS.indices, ...MARKETS.sectors, ...MARKETS.other].forEach(m=>{ if (!cfg.hiddenMk.includes(m.sym)) s.add(m.sym); });
  return [...s];
}

async function loadMetrics(syms){
  const today = etNow().date;
  const need = syms.filter(s => !metrics[s] || metrics[s].date !== today);
  await Promise.all(need.map(sym => limited(async ()=>{
    try{
      const m = (await api("stock/metric?metric=all&symbol=" + encodeURIComponent(sym))).metric || {};
      const r = {}; PERIODS.forEach(p=>{ if (p.f && m[p.f]!=null && isFinite(+m[p.f])) r[p.f] = +m[p.f]; });
      metrics[sym] = {date:today, hi: m["52WeekHigh"]!=null ? +m["52WeekHigh"] : null, lo: m["52WeekLow"]!=null ? +m["52WeekLow"] : null, r};
    }catch(e){ /* metrics are optional */ }
  }, true)));
  store.set("metrics", metrics);
}

/* ---------- Twelve Data (optional free key): price history for time frames + mutual fund NAVs ----------
   Free plan: 8 calls a minute, 800 a day. This app uses about 30 to 40 a day. */
const TD = {times:[], q:[], timer:null};
function tdCall(path){
  return new Promise((res, rej)=>{ const job = {path,res,rej}; path.startsWith("quote") ? TD.q.unshift(job) : TD.q.push(job); tdPump(); });
}
function tdPump(){
  const now = Date.now(); TD.times = TD.times.filter(t => now - t < 61000);
  while (TD.q.length && TD.times.length < 7){
    const j = TD.q.shift(); TD.times.push(Date.now());
    const u = store.get("tdUsed", {}); const d = etNow().date; store.set("tdUsed", {date:d, n:(u.date===d?u.n:0)+1});
    fetch("https://api.twelvedata.com/" + j.path + "&apikey=" + encodeURIComponent(settings.tdKey))
      .then(r => r.json()).then(js => { if (js.status === "error") throw new Error(js.message || "Twelve Data error"); j.res(js); })
      .catch(e => j.rej(e));
  }
  if (TD.q.length && !TD.timer) TD.timer = setTimeout(()=>{ TD.timer = null; tdPump(); }, 61000 - (now - TD.times[0]) + 100);
}

/* failover: if Finnhub can't price a symbol, ask Twelve Data instead (capped at 150 a day) */
async function backupQuote(sym){
  if (!settings.tdKey) return null;
  const d = etNow().date, fb = store.get("tdFallback", {});
  const used = fb.date === d ? fb.n : 0; if (used >= 150) return null;
  store.set("tdFallback", {date:d, n:used+1});
  const j = await tdCall("quote?symbol=" + encodeURIComponent(sym));
  if (!j.close) return null;
  return {c:+j.close, pc:+j.previous_close, d:+j.change, dp:+j.percent_change, h:+j.high, l:+j.low, o:+j.open, t:0, src:"backup"};
}
let hist = store.get("hist", {});   // sym -> {date, last:{d,c}, refs:{5D:{d,c},...}}
function addMonths(dateStr, n){ const d = new Date(dateStr + "T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() - n); return d.toISOString().slice(0,10); }
async function loadHist(syms){
  if (!settings.tdKey) return;
  const today = etNow().date;
  const need = syms.filter(s => !hist[s] || hist[s].date !== today);
  for (const sym of need){
    tdCall("time_series?symbol=" + encodeURIComponent(sym) + "&interval=1day&outputsize=1300").then(js=>{
      const vals = (js.values || []).filter(v => v.datetime < today).map(v => ({d:v.datetime.slice(0,10), c:+v.close})); // newest first, completed days only
      if (!vals.length) return;
      const refs = {};
      PERIODS.forEach(p=>{
        let r = null;
        if (p.sessions) r = vals[p.sessions-1] || null;
        else if (p.months){ const t = addMonths(today, p.months); r = vals.find(v => v.d <= t) || null; if (r && vals[vals.length-1].d > t) r = null; }
        else if (p.ytd){ const t = today.slice(0,4) + "-01-01"; r = vals.find(v => v.d < t) || null; }
        if (r) refs[p.k] = r;
      });
      hist[sym] = {date:today, last:vals[0], refs};
      store.set("hist", hist); renderMarkets();
    }).catch(()=>{ /* keep older data */ });
  }
}

let navs = store.get("navs", {});   // sym -> {nav, prev, date, at, err}
async function loadNav(sym){
  try{
    const j = await tdCall("quote?symbol=" + encodeURIComponent(sym));
    if (!j.close) throw new Error("no price returned");
    navs[sym] = {nav:+j.close, prev:+j.previous_close || null, date:j.datetime, at:Date.now()};
  }catch(e){ navs[sym] = Object.assign({}, navs[sym] || {}, {err: String(e.message||e).slice(0,140), at:Date.now()}); }
  store.set("navs", navs); renderPortfolio();
}
async function loadNavs(force){
  if (!settings.tdKey) return;
  const funds = cfg.fixed.filter(f => f.sym && +f.shares > 0);
  await Promise.all(funds.map(f=>{
    const sym = f.sym.toUpperCase(), n = navs[sym];
    if (!force && n && n.at && Date.now() - n.at < 3*3600e3 && !n.err) return null;
    return loadNav(sym);
  }));
}
function fixedInfo(f){
  const sym = (f.sym||"").toUpperCase(), n = sym && navs[sym], sh = +f.shares;
  if (n && n.nav && sh > 0){
    const today = etNow().date;
    return {value: n.nav*sh, nav:n.nav, date:n.date, chgPct: n.prev ? (n.nav/n.prev-1)*100 : null,
            dayUsd: (n.prev && n.date === today) ? (n.nav-n.prev)*sh : 0, live:true};
  }
  return {value: +f.value||0, live:false, err: n && n.err};
}

let busy = false;
async function tick(){
  if (busy) return; busy = true;
  $("bRefresh").classList.add("spin"); lastErr = "";
  try{
    if (!settings.key){ $("needKey").classList.remove("hide"); return; }
    $("needKey").classList.add("hide");
    const syms = allSyms(), day = etNow().date, ses = session().s;
    if (!spark[day]) spark = {[day]:{}};
    let ok = 0;
    await Promise.all(syms.map(sym => limited(async ()=>{
      try{
        let q = null;
        try{ q = await api("quote?symbol=" + encodeURIComponent(sym)); }catch(e){ lastErr = e.message; }
        if (!(q && q.c)){ try{ q = await backupQuote(sym); if (q) lastErr = ""; }catch(e){} }
        if (q && q.c){ quotes[sym] = q; ok++;
          if (ses !== "closed"){ const a = spark[day][sym] || (spark[day][sym] = []); if (!a.length || a[a.length-1] !== q.c){ a.push(q.c); if (a.length > 480) a.shift(); } }
        }
      }catch(e){ lastErr = e.message; }
    })));
    if (ok){ lastUpdate = Date.now(); store.set("lastUpdate", lastUpdate); store.set("lastQuotes", quotes); store.set("spark", spark); }
    renderAll(); checkAlerts();
    loadNavs(false);
    loadHist(marketSyms());
    loadMetrics(syms).then(()=>{ renderAll(); checkAlerts(); });
  } finally {
    busy = false; $("bRefresh").classList.remove("spin"); $("err").textContent = lastErr; renderAll();
  }
}

/* ---------- alerts ---------- */
function effLevels(w){ let lv = (w.levels||[]).slice(); if (w.split && etNow().date >= w.split.date) lv = lv.map(x => +(x / w.split.ratio).toFixed(2)); return lv; }
function evaluate(w){
  const sym = (w.sym||"").toUpperCase(), q = quotes[sym];
  if (!q || !q.c || settings.allOff || w.on===false) return [];
  const out = [], px = q.c;
  if (w.redOn!==false && w.dayDrop && q.dp <= -w.dayDrop) out.push({id:`${sym}-red`, kind:"red", sym, msg:`${sym} is down ${Math.abs(q.dp).toFixed(1)}% today at ${fmt$(px)}`});
  const hi = metrics[sym] && metrics[sym].hi;
  if (hi && w.offHigh && w.offOn!==false){
    const off = (1 - px/hi)*100, st = store.get("offState", {}), inZone = off >= w.offHigh;
    if (inZone && st[sym]===false) out.push({id:`${sym}-off`, kind:"off", sym, msg:`${sym} just fell ${off.toFixed(1)}% below its 52-week high (${fmt$(hi)})`});
    if (st[sym]!==inZone){ st[sym]=inZone; store.set("offState", st); }
  }
  if (w.levelsOn!==false) effLevels(w).forEach(L=>{
    if (px <= L) out.push({id:`${sym}-L${L}`, kind:"level", sym, msg:`${sym} hit your ${fmt$(L)} level (now ${fmt$(px)})`});
    else if (w.nearOn!==false && w.near && px <= L*(1+w.near/100)) out.push({id:`${sym}-N${L}`, kind:"near", sym, msg:`${sym} is ${((px/L-1)*100).toFixed(1)}% above your ${fmt$(L)} level`});
  });
  return out;
}
function firedToday(){ const day = etNow().date; let f = store.get("fired", {}); if (f.day !== day) f = {day, ids:{}, log:[], unseen:0}; return f; }
function checkAlerts(){
  const f = firedToday(), fresh = [];
  cfg.watch.forEach(w => evaluate(w).forEach(a => { if (!f.ids[a.id]){ f.ids[a.id] = 1; f.log.unshift({t:Date.now(), msg:a.msg, kind:a.kind}); fresh.push(a); } }));
  if (fresh.length) f.unseen = (f.unseen||0) + fresh.length;

const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length+3)%4)), c => c.charCodeAt(0));
async function enableBackground(){
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error("this browser doesn't support background alerts");
  const perm = await Notification.requestPermission(); if (perm !== "granted") throw new Error("notifications are blocked for this app");
  const reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
  let bg = store.get("bg", {});
  if (!bg.pub){
    const kp = await crypto.subtle.generateKey({name:"ECDSA", namedCurve:"P-256"}, true, ["sign","verify"]);

    bg.priv = (await crypto.subtle.exportKey("jwk", kp.privateKey)).d;

  const old = await reg.pushManager.getSubscription(); if (old) await old.unsubscribe();

  bg.sub = sub.toJSON(); delete bg.hash; store.set("bg", bg);
}

/* ---------- small charts ---------- */
function sparkSvg(sym, levels){
  const q = quotes[sym], arr = ((spark[etNow().date]||{})[sym]||[]).slice();
  const W = 64, H = 26;
  const pts = arr.length >= 2 ? arr : (q && q.pc && q.c ? [q.pc, q.o || q.pc, q.c] : []);
  if (pts.length < 2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"></svg>`;
  const ref = q && q.pc ? q.pc : pts[0];
  const near = (levels||[]).filter(L => L >= Math.min(...pts)*0.98 && L <= Math.max(...pts)*1.02);
  const lo = Math.min(...pts, ref, ...near), hi = Math.max(...pts, ref, ...near), span = (hi-lo) || 1;
  const y = v => (H-3) - (v-lo)/span*(H-6), x = i => i/(pts.length-1)*W;
  const d = pts.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("");
  const col = q && q.c < ref ? "var(--down)" : "var(--up)";
  const area = d + `L${W},${H}L0,${H}Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${area}" fill="${col}" opacity=".10"/>
    <line x1="0" x2="${W}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--muted)" stroke-opacity=".6" stroke-dasharray="1 3" vector-effect="non-scaling-stroke"/>
    ${near.map(L=>`<line x1="0" x2="${W}" y1="${y(L)}" y2="${y(L)}" stroke="var(--warn)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`).join("")}
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function rangeBar(lo, hi, v, loLbl, hiLbl){
  if (!(lo && hi && v) || hi <= lo) return "";
  const p = Math.max(0, Math.min(100, (v-lo)/(hi-lo)*100));
  return `<div class="range"><div class="bar"><i style="left:calc(${p}% - 1px)"></i></div><div class="lbl"><span>${loLbl} ${fmt$(lo)}</span><span>${hiLbl} ${fmt$(hi)}</span></div></div>`;
}
function heatColor(p, cap){
  if (p == null || !isFinite(p)) return "var(--surface-2)";
  const a = Math.min(1, Math.abs(p)/cap), pct = Math.round(18 + a*62);
  return `color-mix(in srgb, ${p>=0?"var(--up)":"var(--down)"} ${pct}%, var(--surface-2))`;
}

        line = `<span>Next buy <b>${fmt$(lv[0],0)}</b></span><span class="st ${st}">${d.toFixed(1)}% away</span>`; }
    } else if (px && q.dp!=null && w.redOn!==false && w.dayDrop && q.dp <= -w.dayDrop){ st = "hit"; line = `<span class="st hit">Red day: ${fmtPct(q.dp,1)}</span>`; }
    else line = `<span class="muted">${w.note ? "" : "Watching"}</span>`;
    if (!off){ if (st==="hit") hits++; else if (st==="near") nears++; }
    let lad = "";
    if (useLv && px){
      const all = [...lv, px], lo = Math.min(...all), hi = Math.max(...all), pad = (hi-lo)*0.08 || hi*0.02;
      const pos = v => ((v-(lo-pad))/((hi+pad)-(lo-pad))*100).toFixed(1);
      const zone = lv.length > 1 ? `<div class="zone" style="left:${pos(lv[lv.length-1])}%;width:${(pos(lv[0])-pos(lv[lv.length-1])).toFixed(1)}%"></div>` : "";
      lad = `<div class="lad" title="Your buy levels (orange) and today's price (blue)"><div class="track"></div>${zone}${lv.map(L=>`<div class="tk" style="left:${pos(L)}%"></div><div class="tl num" style="left:${pos(L)}%">${fmt$(L,0)}</div>`).join("")}<div class="now" style="left:${pos(px)}%"></div></div>`;
    }
    const right = `<span class="r">${fromHi!=null?`<span class="num">${fromHi>=0?"−":"+"}${Math.abs(fromHi).toFixed(1)}% from high</span>`:""}${off?`<span class="chip">alerts off</span>`:""}<button class="rbtn" data-ref="${esc(sym)}" title="Refresh just ${esc(sym)}" aria-label="Refresh ${esc(sym)}">↻</button></span>`;
    return `<div class="wrow ${off?"muted-row":st?"st-"+st:""}"><div class="wtop">
      <div class="s">${esc(sym)}<small>${esc(w.note||"")}</small></div>
      ${sparkSvg(sym, lv)}
      <div class="v num" style="text-align:right">${px?fmt$(px):"—"}</div>
      <div class="dp num ${cls(q&&q.dp)}">${q?fmtPct(q.dp):"—"}</div></div>
      ${lad}<div class="wmeta">${line}${right}</div></div>`;
  }).join("");
  $("wl-body").innerHTML = html || `<div class="empty">No tickers yet. <button data-open="alerts">Add one</button></div>`;
  $("wl-sum").innerHTML = settings.allOff ? `<span class="muted">alerts paused</span>` : (hits?`<span class="down" style="font-weight:600">${hits} at level</span>`:"") + (nears?`<span style="color:var(--warn);font-weight:600">${nears} near</span>`:"") + (!hits&&!nears?`<span class="muted">${cfg.watch.length} watching</span>`:"");
}
function renderLog(){
  const f = firedToday();
  $("log-sum").innerHTML = f.log.length ? `<span>${f.log.length} today</span>` : `<span class="muted">none yet</span>`;

function renderAll(){
  const ses = session();
  $("mkt").className = "pill " + (ses.s==="open"?"open":ses.s==="ext"?"ext":"");
  $("mkt").lastElementChild.textContent = {"Market open":"Open","Pre-market":"Pre-market","After hours":"After hours","Closed":"Closed","Weekend":"Weekend"}[ses.label] || ses.label;
  $("mkt").title = ses.s==="open" ? "Market open · live prices" : ses.label + " · showing the 4 PM close. The free data feeds don't carry pre-market or after-hours prices.";

  document.body.classList.toggle("compact", !!settings.compact);
  document.querySelectorAll(".sec").forEach(s => s.classList.toggle("collapsed", !!settings.collapsed[s.dataset.sec]));

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-ref],[data-tile],[data-nav],[data-ord],[data-toggle],[data-grp],[data-row],[data-sort],[data-per],[data-open]");
  if (!t) return;
  if (t.dataset.ref){ e.stopPropagation(); refreshOne(t.dataset.ref); return; }
  if (t.dataset.tile){ settings.focus = settings.focus===t.dataset.tile ? "" : t.dataset.tile; saveSettings(); renderMarkets(); if (settings.focus) refreshOne(t.dataset.tile); return; }
  if (t.dataset.nav){ toast("Checking " + t.dataset.nav + "…"); navs[t.dataset.nav] = Object.assign({}, navs[t.dataset.nav]||{}, {err:null}); loadNav(t.dataset.nav).then(()=>{ const n = navs[t.dataset.nav]; toast(n && n.err ? "Couldn't update: " + n.err : t.dataset.nav + " NAV " + fmt$(n.nav) + " (" + n.date + ")"); }); return; }
  if (t.dataset.ord){ settings.heatOrder = t.dataset.ord; saveSettings(); renderMarkets(); return; }
  if (t.dataset.toggle){
    if (settings.compact){ settings.compact = false; Object.keys(settings.collapsed).forEach(k=>settings.collapsed[k]=true); settings.collapsed[t.dataset.toggle] = false; }
    else settings.collapsed[t.dataset.toggle] = !settings.collapsed[t.dataset.toggle];
    saveSettings(); renderAll(); return;
  }
  if (t.dataset.grp != null){ settings.grpCollapsed[t.dataset.grp] = !settings.grpCollapsed[t.dataset.grp]; saveSettings(); renderPortfolio(); return; }
  if (t.dataset.row){ if (e.target.closest(".detail")) return; openRows.has(t.dataset.row) ? openRows.delete(t.dataset.row) : openRows.add(t.dataset.row); renderPortfolio(); return; }
  if (t.dataset.sort){ settings.sort = t.dataset.sort; saveSettings(); renderPortfolio(); return; }
  if (t.dataset.per){ settings.period = t.dataset.per; saveSettings(); renderMarkets(); return; }
  if (t.dataset.open){ openSheet(t.dataset.open); return; }
});
document.addEventListener("keydown", e=>{
  if (e.target.matches("input,textarea,select")) return;
  if (e.key==="Escape" && !$("menu").classList.contains("hide")) closeMenu();
  else if (e.key==="Escape" && !$("sheet").classList.contains("hide")) closeSheet();
  else if (e.key==="r"||e.key==="R") schedule(true);
  else if (e.key==="c"||e.key==="C") $("bCompact").click();
  else if (e.key===",") openSheet("general");
  else if ((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.row){ e.preventDefault(); e.target.click(); }
});

      catch(e){ $("bgErr").textContent = "Couldn't connect: " + (e.message || e) + (location.protocol!=="https:" ? " (open the app from its web address)" : ""); }
    };
    $("bgCopy").onclick = async ()=>{ const t = $("bgCode"); try{ await navigator.clipboard.writeText(t.value); }catch(e){ t.select(); document.execCommand("copy"); } const b = store.get("bg", {}); b.hash = bgHash(); store.set("bg", b); toast("Copied. Paste it into GitHub"); showTab("background"); };
  }
  else if (tab==="markets"){
    const grp = (title, arr) => `<div class="field"><label>${title}</label><div class="mk-list">${arr.map(m=>`<label><input type="checkbox" data-mk="${m.sym}" ${cfg.hiddenMk.includes(m.sym)?"":"checked"}> ${esc(m.name)} <span class="muted">${m.sym}</span></label>`).join("")}</div></div>`;
    B.innerHTML = `<p class="muted" style="margin-top:0;font-size:12px">Choose what the Markets panel shows. Sectors are tracked with ETFs (e.g. XLV for healthcare).</p>
      ${grp("Indexes", MARKETS.indices)}${grp("Sectors", MARKETS.sectors)}${grp("Other markets", MARKETS.other)}`;
    B.onchange = e=>{ const s = e.target.dataset.mk; if (!s) return; cfg.hiddenMk = cfg.hiddenMk.filter(x=>x!==s); if (!e.target.checked) cfg.hiddenMk.push(s); store.set("cfg", cfg); renderAll(); if (e.target.checked) schedule(true); };
  }
  else if (tab==="backup"){
    B.innerHTML = `
      <div class="field"><label>Back up your setup</label><p>Holdings, funds and cash, watchlist and alert rules. Your key is not included. Keep this private.</p></div>
      <textarea class="code" id="bTxt" spellcheck="false">${esc(JSON.stringify(cfg))}</textarea>
      <div style="display:flex;gap:8px;margin:8px 0 18px;flex-wrap:wrap"><button class="btn" id="bCopy">Copy</button><button class="btn" id="bDl">Download file</button></div>
      <div class="field"><label>Restore</label><p>Paste a backup above, then click Restore. This replaces your current list.</p></div>
      <button class="btn primary" id="bRestore">Restore from the box above</button><div class="err" id="bErr"></div>`;
    $("bCopy").onclick = async ()=>{ try{ await navigator.clipboard.writeText($("bTxt").value); toast("Copied"); }catch(e){ $("bTxt").select(); document.execCommand("copy"); toast("Copied"); } };
    $("bDl").onclick = ()=>{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([$("bTxt").value], {type:"application/json"})); a.download = "market-widget-backup.json"; a.click(); };
    $("bRestore").onclick = ()=>{
      try{ const c = JSON.parse($("bTxt").value); if (!Array.isArray(c.holdings) || !Array.isArray(c.watch)) throw new Error("this doesn't look like a widget backup");
        c.fixed = c.fixed || []; c.hiddenMk = c.hiddenMk || []; cfg = c; store.set("cfg", cfg); toast("Restored"); closeSheet(); schedule(true);
      }catch(e){ $("bErr").textContent = "Couldn't restore: " + e.message; }
    };
  }
}

/* ---------- loop ---------- */
let timer = null;
function schedule(now){
  clearTimeout(timer);
  const next = ()=>{ const ms = refreshMs(); if (ms) timer = setTimeout(run, ms); };
  const run = async ()=>{ await tick(); next(); };
  if (now) run(); else next();
}
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && refreshMs() && lastUpdate && Date.now()-lastUpdate > refreshMs()) schedule(true); });

/* ---------- app shell: title bar overlay, first-run size, offline cache ---------- */
(function(){
  const wco = navigator.windowControlsOverlay;
  const apply = ()=> document.body.classList.toggle("wco", !!(wco && wco.visible));
  if (wco){ apply(); wco.addEventListener("geometrychange", apply); }
  try{
    const standalone = matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: window-controls-overlay)").matches;
    if (standalone && !store.get("sized", false)){ store.set("sized", true); window.resizeTo(440, 900); }
  }catch(e){}
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

renderAll(); updateBadge();
schedule(true);
</script>
