name: Build Windows app

# Builds the MW desktop app (a small tray shell around the hosted widget).
# Push a tag like app-v1.0.0 to publish an installer on the Releases page.
on:
  push:
    tags: ['app-v*']
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> target'
      - name: Install build tools
        working-directory: app
        run: npm ci
      - name: Build (and publish when this is a release tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || '' }}
          releaseName: 'MW for Windows ${{ github.ref_name }}'
          releaseBody: |
            **Install:** download `Market Widget_..._x64-setup.exe` below and run it. Windows may say "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.

            MW sits in the system tray: closing the window keeps alerts running. Ctrl+Alt+M shows or hides it. Quit from the tray icon.
            The widget inside updates by itself; you only need a new installer when this app shell changes.

            Information only. MW never trades and never connects to a brokerage.
          releaseDraft: false
          prerelease: false
      - name: Keep the installer from this build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mw-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
