<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MW Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0e1116;color:#b7bfcc;font:13px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;user-select:none}
@media (prefers-color-scheme: light){html,body{background:#f4f6f9;color:#3c4555}b{color:#131722 !important}}
body{display:grid;place-items:center;text-align:center}
b{color:#e9ecf1;font-size:14px;font-weight:600}
.logo{width:48px;height:48px;margin:0 auto 12px;display:block}
/* stay a plain dark window for the first moment: when the network is up, the page's opening animation takes over */
#wrap{opacity:0;transition:opacity .3s}
#wrap.show{opacity:1}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5b9dff;margin:0 2px;animation:p 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
button{margin-top:10px;background:#5b9dff;color:#0b1220;border:0;border-radius:8px;padding:6px 14px;font:600 12px inherit;cursor:pointer}
#off{display:none}
</style></head>
<body data-tauri-drag-region>
<div id="wrap" data-tauri-drag-region>
  <svg class="logo" data-tauri-drag-region viewBox="0 0 64 64" aria-hidden="true"><rect x=".75" y=".75" width="62.5" height="62.5" rx="15" fill="#0c121d" stroke="#2a3446" stroke-width="1.5"/><path d="M10 51 H54" stroke="#2a3446" stroke-width="1.5"/><path d="M11 12v38" stroke="#2fcf7d" stroke-width="1.8"/><rect x="8" y="15" width="6" height="32" rx="1.2" fill="#2fcf7d"/><path d="M21.5 22v26" stroke="#f26d6d" stroke-width="1.8"/><rect x="18.5" y="25" width="6" height="19" rx="1.2" fill="#f26d6d"/><path d="M32 31v18" stroke="#f26d6d" stroke-width="1.8"/><rect x="29" y="34" width="6" height="11" rx="1.2" fill="#f26d6d"/><path d="M42.5 22v26" stroke="#2fcf7d" stroke-width="1.8"/><rect x="39.5" y="25" width="6" height="19" rx="1.2" fill="#2fcf7d"/><path d="M53 12v38" stroke="#2fcf7d" stroke-width="1.8"/><rect x="50" y="15" width="6" height="32" rx="1.2" fill="#2fcf7d"/></svg>
  <div id="on" data-tauri-drag-region><b>MW Lab</b><br><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div id="off" data-tauri-drag-region><b>Waiting for the internet</b><br>MW Lab will open as soon as you're online.<br><button id="retry">Try now</button></div>
</div>
<script>
// Launcher: the widget itself is hosted, so updates arrive without reinstalling.
// Wait for a connection first (Windows startup can beat the network).
const APP = "https://awpmap.github.io/market-widget/lab/";
let tries = 0, timer = 0, leaving = false;
const log = (level, msg) => { try { window.__TAURI__ && window.__TAURI__.core.invoke("shell_log", { level, msg: "launcher: " + msg }); } catch (e) {} };
// #splash asks the page for its opening animation (only on this first open, never on reloads)
function go(why){ if (leaving) return; leaving = true; log("info", "opening MW Lab (" + why + ")"); location.replace(APP + "#splash"); }
const showT = setTimeout(() => document.getElementById("wrap").classList.add("show"), 700);
async function attempt(){
  clearTimeout(timer); tries++;
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 8000);   // a stalled check can't hold the launcher
  try {
    // GitHub Pages allows cross-origin reads, so a real status check is possible
    const r = await fetch(APP + "manifest.webmanifest?ping=" + Date.now(), { cache: "no-store", signal: ac.signal });
    if (!r.ok) throw new Error("status " + r.status);
    go("online");
  } catch (e) {
    log("warn", "check " + tries + " failed: " + (e.name === "AbortError" ? "timed out" : e.message));
    document.getElementById("wrap").classList.add("show");
    document.getElementById("on").style.display = "none";
    document.getElementById("off").style.display = "block";
    // After ~1 minute offline, open anyway: the app's offline copy may load from cache.
    if (tries >= 10) { go("offline copy"); return; }
    timer = setTimeout(attempt, 5000);
  } finally { clearTimeout(t); }
}
document.getElementById("retry").onclick = () => { tries = 0; attempt(); };
window.addEventListener("online", attempt);
// tell the tray app this page is alive (so its watchdog doesn't reload while we wait)
const alive = () => { try { window.__TAURI__ && window.__TAURI__.core.invoke("shell_alive"); } catch (e) {} };
alive(); setInterval(alive, 30000);
log("info", "start");
attempt();
</script>
</body></html>
